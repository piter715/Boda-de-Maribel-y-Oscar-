<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower - Nuestra Pequeña Princesa</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #ffe4e1;
            --pink-main: #ffb7c5;
            --honey: #ffb900;
            --brown: #704214;
            --white: #fffaf0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #fdf5e6;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor Principal */
        .card {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            position: relative;
            margin: 15px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 8px solid #f2e3d5;
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }

        /* Efecto de Abejas Flotantes */
        .bee {
            position: absolute;
            width: 30px;
            z-index: 10;
            animation: fly 6s infinite ease-in-out;
        }

        @keyframes fly {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            50% { transform: translate(20px, -30px) rotate(15deg); }
        }

        /* Encabezado */
        .header {
            background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), 
                        url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            padding: 40px 20px;
            border-bottom: 5px dashed var(--pink-main);
        }

        .header h2 {
            font-size: 1.2rem;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-title {
            font-family: 'Pacifico', cursive;
            font-size: 3.5rem;
            color: var(--pink-main);
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px rgba(0,0,0,0.05);
            margin: 10px 0;
        }

        .subtitle {
            background: var(--pink-main);
            color: white;
            padding: 5px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .princess {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--pink-main);
            display: block;
        }

        /* Ilustración Central (Simulada) */
        .illustration {
            padding: 20px;
            position: relative;
        }

        .circle-frame {
            width: 220px;
            height: 220px;
            margin: 0 auto;
            border-radius: 50%;
            border: 10px solid var(--pink-light);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }

        /* Burbujas animadas */
        .bubble {
            position: absolute;
            background: rgba(173, 216, 230, 0.4);
            border-radius: 50%;
            animation: bubbleUp 4s infinite;
        }

        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Detalles del Evento */
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 20px;
            gap: 10px;
            background: #fff9f0;
        }

        .info-box {
            padding: 10px;
        }

        .info-box span {
            display: block;
            font-weight: bold;
            color: var(--brown);
        }

        .day { font-size: 1.5rem; color: var(--pink-main) !important; }
        .location { grid-column: span 3; border-top: 1px solid #eee; padding-top: 15px; }

        /* Sección Regalos */
        .gifts {
            background: #fdf2f4;
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
            border: 2px dashed var(--pink-main);
        }

        .gifts h3 {
            font-family: 'Pacifico', cursive;
            color: var(--pink-main);
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            padding: 30px;
            font-style: italic;
            color: var(--brown);
            font-size: 0.9rem;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botón de ubicación interactivo */
        .map-btn {
            background: var(--honey);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-top: 10px;
            font-weight: 600;
            transition: 0.3s;
        }
        .map-btn:hover { transform: scale(1.05); background: #e6a700; }

    </style>
</head>
<body>

    <div class="card">
        <!-- Abejitas decorativas -->
        <div class="bee" style="top: 10%; left: 10%;">🐝</div>
        <div class="bee" style="top: 25%; right: 5%; animation-delay: 2s;">🐝</div>

        <div class="header">
            <h2>Te invitamos a un</h2>
            <h1 class="main-title">Baby Shower</h1>
            <div class="subtitle">EN HONOR A</div>
            <span class="princess">nuestra pequeña princesa</span>
        </div>

        <div class="illustration">
            <div class="circle-frame">
                <!-- Aquí iría la imagen de Pooh y Piglet -->
                🍯
                <!-- Efecto de burbujas -->
                <div class="bubble" style="width:20px; height:20px; left:20%; bottom:20%;"></div>
                <div class="bubble" style="width:15px; height:15px; left:40%; bottom:10%; animation-delay: 1s;"></div>
                <div class="bubble" style="width:25px; height:25px; right:30%; bottom:15%; animation-delay: 2s;"></div>
            </div>
        </div>

        <div class="details">
            <div class="info-box">
                <small>DOMINGO</small>
                <span class="day">26</span>
                <small>DE JULIO</small>
            </div>
            <div class="info-box" style="border-left: 1px solid #ddd; border-right: 1px solid #ddd;">
                <small>HORA</small>
                <span style="font-size: 1.2rem; margin-top: 5px;">5:00 PM</span>
                <span>🕒</span>
            </div>
            <div class="info-box">
                <small>LUGAR</small>
                <span style="font-size: 0.8rem; margin-top: 5px;">QUINTA PATY</span>
                <span>📍</span>
            </div>
            <div class="location">
                <p><strong>Dirección:</strong> Zaragoza Norte 413</p>
                <a href="https://www.google.com/maps/search/Zaragoza+Norte+413" target="_blank" class="map-btn">Ver Ubicación</a>
            </div>
        </div>

        <div class="gifts">
            <h3>Lluvia de Regalos</h3>
            <p>Pañales, ropa y accesorios para bebé</p>
            <div style="font-size: 2rem;">🎁</div>
        </div>

        <div class="footer">
            <p>Te esperamos para compartir este momento tan especial</p>
        </div>
    </div>

    <script>
        // Efecto simple para crear más abejas al azar
        for (let i = 0; i < 5; i++) {
            let bee = document.createElement('div');
            bee.className = 'bee';
            bee.innerHTML = '🐝';
            bee.style.left = Math.random() * 90 + '%';
            bee.style.top = Math.random() * 90 + '%';
            bee.style.animationDuration = (Math.random() * 3 + 4) + 's';
            bee.style.animationDelay = Math.random() * 5 + 's';
            document.querySelector('.card').appendChild(bee);
        }
    </script>
</body>
</html>
